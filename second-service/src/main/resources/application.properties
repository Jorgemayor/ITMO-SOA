# Server Configuration
server.port=8081

# Jetty specific configurations
server.jetty.threads.min=10
server.jetty.threads.max=200
server.jetty.connection-idle-timeout=30000

# Application name
spring.application.name=navigator-service

# Logging
logging.level.root=INFO
logging.level.com.example.restservice=DEBUG

# MainService
external.api.base-url=http://localhost:8080/api/v1
external.api.timeout=5000

